<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A warm-canvas editorial interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}


/* staggered entrance — one orchestrated load beat */
.reveal { opacity: 0; transform: translateY(34px);
  transition: opacity .75s cubic-bezier(.16,1,.3,1), transform .75s cubic-bezier(.16,1,.3,1); }
.slide.visible .reveal { opacity: 1; transform: none; }
.slide.visible .reveal:nth-child(1) { transition-delay: .05s; }
.slide.visible .reveal:nth-child(2) { transition-delay: .17s; }
.slide.visible .reveal:nth-child(3) { transition-delay: .29s; }
.slide.visible .reveal:nth-child(4) { transition-delay: .41s; }
.slide.visible .reveal:nth-child(5) { transition-delay: .53s; }


:root {
    --bg-primary: #0f0f0f;
    --text-primary: #e8e4df;
    --text-secondary: #9a9590;
    --accent-warm: #d4a574;
    --accent-pink: #e8b4b8;
    --accent-gold: #c9b896;
    --stage-bg: #050505;
    --slide-bg: #0f0f0f;
}
.slide { background: var(--bg-primary); color: var(--text-primary);
         font-family: "IBM Plex Sans", sans-serif; }

/* abstract soft shapes — blurred overlapping gradient circles, no illustrations */
.orb { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
.orb-1 { width: 760px; height: 760px; right: -170px; top: -230px;
         background: radial-gradient(circle at 35% 35%, rgba(212,165,116,.42), transparent 68%); }
.orb-2 { width: 600px; height: 600px; right: 180px; top: 300px;
         background: radial-gradient(circle at 50% 50%, rgba(232,180,184,.30), transparent 68%); }
.orb-3 { width: 480px; height: 480px; left: -140px; bottom: -160px;
         background: radial-gradient(circle at 50% 50%, rgba(201,184,150,.22), transparent 68%); }

.inner { position: absolute; inset: 0; padding: 150px 170px;
         display: flex; flex-direction: column; justify-content: center; }
.rule { width: 2px; height: 108px; background: linear-gradient(to bottom, var(--accent-warm), transparent);
        margin-bottom: 52px; }
.kicker { font-size: 19px; font-weight: 400; letter-spacing: .42em; text-transform: uppercase;
          color: var(--accent-warm); margin-bottom: 40px; }
h1 { font-family: "Cormorant", serif; font-weight: 400; font-size: 150px; line-height: .98;
     letter-spacing: -.022em; margin: 0 0 46px; max-width: 16ch; color: var(--text-primary); }
h1 em { font-style: italic; color: var(--accent-pink); }
.sub { font-size: 31px; font-weight: 300; line-height: 1.5; color: var(--text-secondary);
       max-width: 42ch; margin: 0; }
.footer { position: absolute; left: 170px; right: 170px; bottom: 92px;
          display: flex; justify-content: space-between; align-items: baseline;
          font-size: 19px; color: var(--text-secondary); letter-spacing: .07em; }
.footer .mark { font-family: "Cormorant", serif; font-style: italic; font-size: 30px;
                color: var(--accent-gold); letter-spacing: 0; }

</style>
</head>
<body>
<div class="deck-viewport">
  <main class="deck-stage" id="deckStage">
    <section class="slide title-slide active visible">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="inner">
        <div class="rule reveal"></div>
        <div class="kicker reveal">Design System</div>
        <h1 class="reveal">A warm-canvas <em>editorial</em> interface</h1>
        <p class="sub reveal">Cream, coral and dark navy &mdash; the trinity behind claude.com</p>
      </div>
      <div class="footer">
        <span class="mark">Claude</span>
        <span>October 2026</span>
      </div>
    </section>
  </main>
</div>
<script>
class SlidePresentation {
    constructor() {
        this.slides = document.querySelectorAll('.slide');
        this.currentSlide = 0;
        this.stage = document.getElementById('deckStage');
        this.setupStageScale();
        this.setupKeyboardNav();
        this.showSlide(0);
    }
    setupStageScale() {
        const scale = () => {
            const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            const x = (window.innerWidth - 1920 * factor) / 2;
            const y = (window.innerHeight - 1080 * factor) / 2;
            this.stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
        };
        scale();
        window.addEventListener('resize', scale);
    }
    setupKeyboardNav() {
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                e.preventDefault(); this.showSlide(this.currentSlide + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault(); this.showSlide(this.currentSlide - 1);
            }
        });
    }
    showSlide(index) {
        this.currentSlide = Math.max(0, Math.min(index, this.slides.length - 1));
        this.slides.forEach((slide, i) => {
            slide.classList.toggle('active', i === this.currentSlide);
            slide.classList.toggle('visible', i === this.currentSlide);
        });
    }
}
new SlidePresentation();
</script>
</body>
</html>
