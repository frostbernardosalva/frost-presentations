<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A warm-canvas editorial interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Hanken+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}


/* staggered entrance — one orchestrated load beat */
.reveal { opacity: 0; transform: translateY(34px);
  transition: opacity .75s cubic-bezier(.16,1,.3,1), transform .75s cubic-bezier(.16,1,.3,1); }
.slide.visible .reveal { opacity: 1; transform: none; }
.slide.visible .reveal:nth-child(1) { transition-delay: .05s; }
.slide.visible .reveal:nth-child(2) { transition-delay: .17s; }
.slide.visible .reveal:nth-child(3) { transition-delay: .29s; }
.slide.visible .reveal:nth-child(4) { transition-delay: .41s; }
.slide.visible .reveal:nth-child(5) { transition-delay: .53s; }


:root {
    --paper: #F0EBDE;
    --paper-2: #E6E0CE;
    --ink: #1F2BE0;
    --ink-soft: #5560E5;
    --stage-bg: #D8D2C0;
    --slide-bg: #F0EBDE;
}
.slide { background: var(--paper); color: var(--ink);
         font-family: "Hanken Grotesk", sans-serif; }

/* permanent graph-paper grid — not optional decoration */
.slide::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .10;
    background-image:
        linear-gradient(to right, var(--ink) 1px, transparent 1px),
        linear-gradient(to bottom, var(--ink) 1px, transparent 1px);
    background-size: 48px 48px;
}
/* 1.5px cobalt hairline frame, top and bottom */
.slide::after {
    content: ''; position: absolute; left: 110px; right: 110px; top: 92px; bottom: 92px;
    border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink);
    pointer-events: none;
}
.inner { position: absolute; inset: 0; padding: 168px 150px 168px 150px;
         display: flex; flex-direction: column; justify-content: center; z-index: 2; }
.topbar { display: flex; justify-content: space-between; align-items: baseline;
          font-family: "DM Mono", monospace; font-size: 20px; letter-spacing: .10em;
          text-transform: uppercase; padding-bottom: 18px;
          border-bottom: 1.5px solid var(--ink); margin-bottom: 72px; }
h1 { font-family: "Newsreader", serif; font-weight: 400; font-size: 186px; line-height: .92;
     letter-spacing: -.035em; margin: 0 0 54px; max-width: 15ch; }
.sub { font-size: 32px; font-weight: 400; line-height: 1.48; max-width: 44ch;
       color: var(--ink); opacity: .82; margin: 0; }
.ticker { position: absolute; left: 150px; right: 150px; bottom: 120px; z-index: 2;
          display: flex; justify-content: space-between;
          font-family: "DM Mono", monospace; font-size: 19px; letter-spacing: .08em;
          color: var(--ink-soft); padding-top: 16px; border-top: 1px solid rgba(31,43,224,.28); }

/* pixel-glitch column — stair-stepped scanlines down the right edge */
.glitch { position: absolute; right: 150px; top: 372px; z-index: 2; }
.glitch i { display: block; height: 11px; background: var(--ink); margin-bottom: 7px; }
/* QR-style 8x8 grid patch */
.qr { position: absolute; right: 150px; bottom: 210px; z-index: 2;
      display: grid; grid-template-columns: repeat(8, 13px); gap: 3px; }
.qr s { display: block; width: 13px; height: 13px; background: var(--ink); }
.qr s.o { background: transparent; }

</style>
</head>
<body>
<div class="deck-viewport">
  <main class="deck-stage" id="deckStage">
    <section class="slide title-slide active visible">
      <div class="glitch reveal"><i style="width:118px"></i><i style="width:100px"></i><i style="width:84px"></i><i style="width:72px"></i><i style="width:58px"></i><i style="width:72px"></i><i style="width:48px"></i><i style="width:34px"></i><i style="width:48px"></i><i style="width:26px"></i><i style="width:34px"></i><i style="width:18px"></i><i style="width:26px"></i><i style="width:11px"></i></div>
      <div class="qr reveal"><s></s><s></s><s class="o"></s><s></s><s></s><s class="o"></s><s></s><s class="o"></s><s></s><s class="o"></s><s></s><s class="o"></s><s class="o"></s><s></s><s class="o"></s><s></s><s></s><s></s><s></s><s></s><s class="o"></s><s class="o"></s><s></s><s class="o"></s><s class="o"></s><s></s><s class="o"></s><s></s><s></s><s></s><s class="o"></s><s></s><s></s><s class="o"></s><s class="o"></s><s></s><s class="o"></s><s></s><s></s><s class="o"></s><s></s><s></s><s></s><s class="o"></s><s></s><s class="o"></s><s class="o"></s><s></s><s class="o"></s><s class="o"></s><s></s><s></s><s class="o"></s><s></s><s></s><s class="o"></s><s></s><s class="o"></s><s></s><s class="o"></s><s></s><s></s><s class="o"></s><s></s></div>
      <div class="inner">
        <div class="topbar reveal"><span>Design System</span><span>October 2026</span></div>
        <h1 class="reveal">A warm-canvas editorial interface</h1>
        <p class="sub reveal">Cream, coral and dark navy &mdash; the trinity behind claude.com</p>
      </div>
      <div class="ticker"><span>Claude</span><span>01</span></div>
    </section>
  </main>
</div>
<script>
class SlidePresentation {
    constructor() {
        this.slides = document.querySelectorAll('.slide');
        this.currentSlide = 0;
        this.stage = document.getElementById('deckStage');
        this.setupStageScale();
        this.setupKeyboardNav();
        this.showSlide(0);
    }
    setupStageScale() {
        const scale = () => {
            const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            const x = (window.innerWidth - 1920 * factor) / 2;
            const y = (window.innerHeight - 1080 * factor) / 2;
            this.stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
        };
        scale();
        window.addEventListener('resize', scale);
    }
    setupKeyboardNav() {
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                e.preventDefault(); this.showSlide(this.currentSlide + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault(); this.showSlide(this.currentSlide - 1);
            }
        });
    }
    showSlide(index) {
        this.currentSlide = Math.max(0, Math.min(index, this.slides.length - 1));
        this.slides.forEach((slide, i) => {
            slide.classList.toggle('active', i === this.currentSlide);
            slide.classList.toggle('visible', i === this.currentSlide);
        });
    }
}
new SlidePresentation();
</script>
</body>
</html>
